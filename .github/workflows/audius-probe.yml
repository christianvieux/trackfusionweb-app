name: Audius catalog proof (temporary)

on:
  push:
    branches:
      - feat/audius-catalog-proof

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read Audius metadata and HEAD one permitted stream endpoint
        run: node scripts/probeAudius.mjs
