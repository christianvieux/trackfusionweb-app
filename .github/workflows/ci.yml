name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: https://api.trackfusionweb.com
      NEXT_PUBLIC_SITE_URL: https://trackfusionweb.com
      NEXT_PUBLIC_ALLOWED_IMAGE_DOMAINS: christianvieux-trackfusionweb-storage-bucket.s3.us-east-1.amazonaws.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
